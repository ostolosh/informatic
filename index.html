<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Інформатика 5–11</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Конспекти, тести й практичні роботи з прикладами за програмами Ривкінда, Морзе та Бондаренка, 12-бальне оцінювання.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Інформатика 5–11. Концепт: шкільний зошит у клітинку, синя паста для тексту, червона ручка вчителя для балів.
   Автори програм мають власні кольори, але завжди підписані словами. */
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --surface-2:#EDF1F9; --fg:#14204B; --fg-2:#4B5679; --line:#D3DBEC; --grid:#E4EAF6;
  --brand:#1B3DA8; --brand-fg:#FFFFFF; --brand-soft:#E3E9FB; --pen:#C4302B;
  --rivkind:#0A767F; --morze:#6446BC; --bondarenko:#A85A00;
  --ok:#17784A; --ok-bg:#E1F3E8; --bad:#B3261E; --bad-bg:#FBE6E4; --note:#7A5200; --note-bg:#FFF2D4;
  --lv1:#C4302B; --lv2:#C07A00; --lv3:#2A66D0; --lv4:#17874F;
  --code-bg:#0F1838; --code-fg:#E5EBFF; --code-line:#26336B;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 1px 0 rgba(20,32,75,.04),0 6px 18px -10px rgba(20,32,75,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1226; --surface:#151C38; --surface-2:#1C2547; --fg:#E7ECFA; --fg-2:#A3AED0; --line:#2A3563; --grid:#18214A;
    --brand:#8FA8FF; --brand-fg:#0D1226; --brand-soft:#212C5A; --pen:#FF7B72;
    --rivkind:#4CCFD8; --morze:#AD94FF; --bondarenko:#FFAE57;
    --ok:#5FD39A; --ok-bg:#12372A; --bad:#FF8A82; --bad-bg:#43191A; --note:#FFCB6B; --note-bg:#3B2D0F;
    --lv1:#FF7B72; --lv2:#F0A93B; --lv3:#6EA0FF; --lv4:#4CD38C;
    --code-bg:#0A0F26; --code-fg:#E5EBFF; --code-line:#26336B;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1226; --surface:#151C38; --surface-2:#1C2547; --fg:#E7ECFA; --fg-2:#A3AED0; --line:#2A3563; --grid:#18214A;
  --brand:#8FA8FF; --brand-fg:#0D1226; --brand-soft:#212C5A; --pen:#FF7B72;
  --rivkind:#4CCFD8; --morze:#AD94FF; --bondarenko:#FFAE57;
  --ok:#5FD39A; --ok-bg:#12372A; --bad:#FF8A82; --bad-bg:#43191A; --note:#FFCB6B; --note-bg:#3B2D0F;
  --lv1:#FF7B72; --lv2:#F0A93B; --lv3:#6EA0FF; --lv4:#4CD38C;
  --code-bg:#0A0F26; --code-fg:#E5EBFF; --code-line:#26336B;
  --shadow:none; color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--brand);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(26px,4.6vw,42px)}
h2{font-size:clamp(20px,3vw,26px)}
h3{font-size:17px}
p{margin:0 0 .8em}
small,.muted{color:var(--fg-2)}
code{font-family:var(--f-mono);font-size:.9em;background:var(--surface-2);padding:.08em .35em;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* верхня панель */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none;margin-right:auto}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:16px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand span{display:block;font-size:12px;color:var(--fg-2);line-height:1.2;margin-top:2px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{color:var(--fg);text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:500;font-size:15px}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.gradebar{background:var(--surface-2);border-bottom:1px solid var(--line)}
.gradebar .wrap{display:flex;align-items:center;gap:10px;padding-block:8px}
.gradebar .lab{font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);flex:none}
.pills{display:flex;gap:6px;overflow-x:auto;padding:2px;scrollbar-width:thin}
.pills a{flex:none;min-width:40px;text-align:center;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;font:600 15px var(--f-mono)}
.pills a:hover{border-color:var(--brand)}
.pills a[aria-current="page"]{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.pills a.off{opacity:.5}

main{padding-block:28px 56px;min-height:60vh}
.crumbs{font-size:14px;color:var(--fg-2);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:4px 8px}
.crumbs a{color:var(--fg-2)}
.crumbs i{font-style:normal;opacity:.6}

/* головна */
.hero{border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,40px);background-color:var(--surface);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px;position:relative;overflow:hidden}
.hero h1{max-width:20ch}
.hero p.lead{font-size:clamp(16px,2vw,19px);max-width:62ch;color:var(--fg);margin:14px 0 0;background:var(--surface);width:fit-content;padding:4px 14px 4px 0}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-fg);font:600 15px var(--f-body);text-decoration:none;cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(1.08);text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--brand)}
.btn.small{padding:6px 12px;min-height:34px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:40px 0 14px}
.sect-h p{margin:0;color:var(--fg-2);font-size:15px}
.grades{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.gcard{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);text-decoration:none;box-shadow:var(--shadow);transition:border-color .15s,transform .15s;min-width:0}
.gcard:hover{border-color:var(--brand);text-decoration:none}
@media (prefers-reduced-motion:no-preference){.gcard:hover{transform:translateY(-2px)}}
.gcard .top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.gcard .big{font:700 52px/1 var(--f-display);color:var(--brand);letter-spacing:-.04em}
.gcard .bin{font:500 13px var(--f-mono);color:var(--fg-2);letter-spacing:.12em;padding-bottom:6px}
.gcard .stage{font-size:13px;color:var(--fg-2);min-height:2.6em}
.gcard .stats{display:flex;gap:14px;font-size:13px;color:var(--fg-2);flex-wrap:wrap}
.gcard .stats b{color:var(--fg);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.gcard.off{opacity:.6;pointer-events:none}
.progs3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.pcard{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.pcard h3{display:flex;align-items:center;gap:10px}
.pcard p{margin:8px 0 0;font-size:14px;color:var(--fg-2)}
.dot{width:12px;height:12px;border-radius:3px;background:var(--pc,var(--brand));flex:none;display:inline-block}
.p-rivkind{--pc:var(--rivkind)}.p-morze{--pc:var(--morze)}.p-bondarenko{--pc:var(--bondarenko)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;counter-reset:st}
.flow>div{padding:14px 16px;border:1px dashed var(--line);border-radius:12px;background:var(--surface);counter-increment:st}
.flow>div::before{content:counter(st);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--brand-fg);font:700 14px var(--f-mono);margin-bottom:8px}
.flow b{display:block}
.flow span{font-size:14px;color:var(--fg-2)}

/* пошук */
.search{position:relative;max-width:560px;margin-top:22px}
.search input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:16px var(--f-body);min-height:46px}
.search input:focus{outline:3px solid var(--brand);outline-offset:1px}
.sres{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 30px -12px rgba(0,0,0,.35);z-index:15;max-height:min(60vh,420px);overflow:auto}
.sres.open{display:block}
.sres a{display:block;padding:10px 14px;text-decoration:none;color:var(--fg);border-bottom:1px solid var(--line)}
.sres a:last-child{border-bottom:0}
.sres a:hover{background:var(--surface-2)}
.sres small{display:block}
.sres .none{padding:12px 14px;color:var(--fg-2)}

/* сторінка класу */
.chead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:6px}
.chead .big{font:700 clamp(44px,8vw,72px)/1 var(--f-display);color:var(--brand);letter-spacing:-.04em;margin-right:14px}
.chead .meta{color:var(--fg-2);font-size:15px;max-width:60ch}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0 18px}
.seg a{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;font-weight:600;font-size:15px;min-height:42px}
.seg a:hover{border-color:var(--pc,var(--brand))}
.seg a[aria-current="page"]{border-color:var(--pc,var(--brand));box-shadow:inset 0 0 0 1px var(--pc,var(--brand));background:var(--surface-2)}
.pinfo{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:18px;font-size:14px;color:var(--fg-2)}
.pinfo b{color:var(--fg)}
.badge{display:inline-block;font:600 11px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--fg-2);vertical-align:middle}
.badge.toc{color:var(--ok);border-color:var(--ok)}
.badge.partial{color:var(--note);border-color:var(--note)}
.sec{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:16px;overflow:hidden}
.sec-h{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.sec-h h3{margin-bottom:3px}
.sec-h p{margin:0;font-size:14px;color:var(--fg-2)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);color:var(--fg);text-decoration:none}
.sec .trow:first-of-type{border-top:0}
.trow:hover{background:var(--surface-2);text-decoration:none}
.trow .tt{font-weight:600}
.trow .ti{font-size:14px;color:var(--fg-2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trow .st{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px 2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--fg-2);background:var(--surface)}
.chip .dot{width:8px;height:8px;border-radius:2px}
.strand-h{margin:28px 0 10px;font:600 13px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2)}
.mark{font:700 17px var(--f-display);color:var(--pen);letter-spacing:-.02em;white-space:nowrap}
.mark small{font-size:11px;color:var(--pen);opacity:.75}
.mark.empty{color:var(--fg-2);font:500 13px var(--f-mono);opacity:.8}
.meter{display:inline-flex;gap:2px;vertical-align:middle}
.meter i{width:6px;height:14px;border-radius:2px;background:var(--line);display:block}
.meter.big i{width:12px;height:26px;border-radius:3px}
.meter.lv1 i.on{background:var(--lv1)}.meter.lv2 i.on{background:var(--lv2)}.meter.lv3 i.on{background:var(--lv3)}.meter.lv4 i.on{background:var(--lv4)}

/* сторінка теми */
.thead{margin-bottom:16px}
.thead h1{margin:8px 0 10px}
.thead .intro{font-size:18px;max-width:68ch;color:var(--fg-2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:20px 0 20px;overflow-x:auto}
.tabs a{padding:10px 16px;color:var(--fg-2);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{color:var(--brand);border-bottom-color:var(--brand)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;align-items:start}
.card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px 18px;min-width:0}
.card h3{margin-bottom:8px}
.card ul,.card ol{margin:.4em 0 .2em;padding-left:1.2em}
.card li{margin:.25em 0}
.card.wide{grid-column:1/-1}
dl.terms{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:8px 18px;margin:0}
dl.terms dt{font-weight:700;color:var(--brand)}
dl.terms dd{margin:0}
@media (max-width:560px){dl.terms{grid-template-columns:1fr}dl.terms dd{margin-bottom:6px}}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:32px}
.pager a{flex:1 1 220px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);text-decoration:none;min-width:0}
.pager a:hover{border-color:var(--brand)}
.pager a small{display:block}
.pager a.next{text-align:right}

/* код */
.codewrap{margin:10px 0;border-radius:10px;overflow:hidden;background:var(--code-bg);border:1px solid var(--code-line)}
.codehead{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 12px;border-bottom:1px solid var(--code-line);font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#9FB0E8}
.codehead button{background:transparent;border:1px solid var(--code-line);color:#CBD6FF;border-radius:6px;padding:3px 10px;font:600 12px var(--f-body);cursor:pointer;min-height:28px}
.codehead button:hover{background:#1B2756}
.codewrap pre{margin:0;padding:12px 14px;overflow-x:auto;color:var(--code-fg);font:14px/1.55 var(--f-mono);tab-size:4}
.codewrap code{background:none;padding:0;font-size:inherit;color:inherit}

/* тест */
.qs{list-style:none;margin:0;padding:0;display:grid;gap:16px;counter-reset:q}
.q{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px 18px;counter-increment:q;min-width:0}
.q.ok{border-color:var(--ok)}.q.bad{border-color:var(--bad)}
.qtext{font-weight:600;margin-bottom:12px;white-space:pre-wrap}
.qtext::before{content:counter(q) ". ";color:var(--brand);font-family:var(--f-mono)}
.qhint{font:600 12px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--fg-2);margin:-6px 0 10px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface);min-height:44px}
.opt:hover{border-color:var(--brand)}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.opt input{margin-top:4px;accent-color:var(--brand);flex:none;width:18px;height:18px}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt.right{border-color:var(--ok);background:var(--ok-bg);cursor:default}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);cursor:default}
.opt.plain{cursor:default}
.opt .mk{flex:none;width:20px;font-weight:800;text-align:center}
.opt.right .mk{color:var(--ok)}.opt.wrong .mk{color:var(--bad)}
.qin{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qin input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:16px var(--f-mono);min-width:0;width:min(100%,260px);min-height:44px}
.why{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--surface-2);font-size:15px}
.why b{color:var(--fg)}
.testbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:18px}
.result{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:center;padding:18px 20px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:18px}
.result .score{font:700 clamp(44px,9vw,64px)/1 var(--f-display);color:var(--pen);letter-spacing:-.04em;grid-row:span 2}
.result .score small{font-size:.38em;color:var(--pen);opacity:.7}
.result .lvl{font-weight:700;font-size:18px}
.result .acts{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
@media (max-width:480px){.result{grid-template-columns:1fr}.result .score{grid-row:auto}}

/* практична */
.pmeta{display:flex;gap:10px 22px;flex-wrap:wrap;margin:6px 0 16px;font-size:14px;color:var(--fg-2)}
.pmeta b{color:var(--fg)}
.steps{margin:.4em 0 0;padding-left:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.steps>li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}
.steps>li::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font:700 13px var(--f-mono);margin-top:1px}
details.ex{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:16px 0}
details.ex>summary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:48px}
details.ex>summary::-webkit-details-marker{display:none}
details.ex>summary::after{content:"Показати";font:600 12px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--brand)}
details.ex[open]>summary::after{content:"Сховати"}

/* ---------- Сховище результатів ---------- */

/* ---------- Утиліти ---------- */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

}
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function $(sel, root) { return (root || document).querySelector(sel); }
function lvl(p) {

function scoreByLevels(items) {
  var g = {}, n = 0;
  items.forEach(function (x) { var l = x.lv || 1; g[l] = g[l] || { c: 0, t: 0 }; g[l].t++; if (x.ok) g[l].c++; });
  var keys = Object.keys(g), sum = 0;
  keys.forEach(function (l) { sum += g[l].c / g[l].t; });
  var p = keys.length ? Math.max(1, Math.round(12 * sum / keys.length)) : 0;
  return { p: p, g: g };
}

function plural(n, a, b, c) { var m = n % 10, k = n % 100; if (k >= 11 && k <= 14) return c; if (m === 1) return a; if (m >= 2 && m <= 4) return b; return c; }

/* ---------- Оцінки ---------- */
function resOf(id) { return S.res[id] || {}; }
function topicGrade(id) {
  var r = resOf(id), T = TOPIC[id];
  var t = r.test ? r.test.best : null, p = r.prac ? r.prac.pts : null;

  if (!T.t.practical) return { v: t, partial: false };
  if (t != null && p != null) {
    var wt = S.w.test, wp = S.w.prac;
    return { v: Math.round((t * wt + p * wp) / ((wt + wp) || 1)), partial: false };

}

// питання з параметрами: vars {a:[2,3,4]}, у тексті {a}, правильну відповідь рахує calc

  if (!q.vars) return q;
  var v = {};
  Object.keys(q.vars).forEach(function (k) { var a = q.vars[k]; v[k] = a[Math.floor(Math.random() * a.length)]; });
  var sub = function (t) { return String(t).replace(/\{(\w+)\}/g, function (m, k) { return v[k] != null ? v[k] : m; }); };
  var res;
  try { res = Function.apply(null, Object.keys(v).concat('return (' + q.calc + ');')).apply(null, Object.keys(v).map(function (k) { return v[k]; })); } catch (e) { res = ''; }
  var out = Object.assign({}, q);
  out.q = sub(q.q); out.why = sub(q.why);
  out.answers = [String(typeof res === 'number' ? +res.toFixed(4) : res)];

}

  [1, 2, 3, 4].forEach(function (l) { out = out.concat(shuffle(all.filter(function (q) { return (q.lv || 1) === l; })).slice(0, per)); });
  return out;
}

}

  } else {
    h += '<div id="panel">' + theoryHtml(t) + '</div>';
  }
  var list = ctxList(T, r.prog), i = list.indexOf(r.id), prev = list[i - 1], next = list[i + 1];
  h += '<div class="pager">' + (prev ? '<a href="' + href({ v: 'tema', id: prev, prog: r.prog }) + '"><small>Попередня тема</small>' + esc(TOPIC[prev].t.title) + '</a>' : '<span></span>') +
    (next ? '<a class="next" href="' + href({ v: 'tema', id: next, prog: r.prog }) + '"><small>Наступна тема</small>' + esc(TOPIC[next].t.title) + '</a>' : '') + '</div>';
  return h;
}

/* тематична контрольна */
function viewKontrol(r) {
  var X = SECTION[r.sid], d = D[X.grade], s = X.s;
  var h = '<div class="crumbs"><a href="#home">Класи</a><i>/</i><a href="' + href({ v: 'klas', g: X.grade }) + '">' + X.grade + ' клас</a><i>/</i><a href="' + href({ v: 'klas', g: X.grade, prog: X.prog }) + '">' + PROG[X.prog].name + '</a><i>/</i><span>Контрольна</span></div>';
  h += '<div class="thead"><div class="tags" style="margin:0">' + progChip(X.prog) + '</div><h1>Тематична контрольна</h1><p class="intro">' + esc(s.title) + '. Питання випадково вибрано з тестів тем розділу, по три на кожному рівні досягнень.</p></div>';
  var key = 'k:' + r.sid;
  if (!run || run.key !== key) buildRun(key, s.title, pickKontrol(s), '<a class="btn ghost" href="' + href({ v: 'klas', g: X.grade, prog: X.prog }) + '">До розділів</a>');
  return h + '<div id="panel">' + testPanel() + '</div>';
}
function pickKontrol(s) {
  var all = [];
  s.topics.forEach(function (id) { all = all.concat(TOPIC[id].t.test); });
  var out = [];
  [1, 2, 3, 4].forEach(function (l) {
    out = out.concat(shuffle(all.filter(function (q) { return (q.lv || 1) === l; })).slice(0, 6));
  });
  return out;
}

/* ---------- Оцінювання ---------- */
function viewOcinuvannya() {
  var h = '<div class="crumbs"><a href="#home">Класи</a><i>/</i><span>Оцінювання</span></div><h1>Оцінювання</h1>' +
    '<p class="muted" style="max-width:70ch;margin-top:10px">Навчальні досягнення оцінюються за 12-бальною шкалою з чотирма рівнями. Для 5–9 класів критерії затверджено наказом МОН від 02.08.2024 № 1093; у 10–11 класах діє та сама шкала й рівні.</p>';
  h += '<div class="sect-h"><h2>Рівні досягнень</h2><p>Кожен наступний рівень охоплює вимоги попереднього</p></div><div class="tbl"><table><thead><tr><th>Рівень</th><th>Бали</th><th>Що це означає</th></tr></thead><tbody>' +
    '<tr class="lvrow"><td>' + meter(2) + ' Початковий</td><td class="num">1–3</td><td>Учень відтворює окремі факти, виконує прості дії за зразком або з допомогою вчителя; у результаті є суттєві помилки.</td></tr>' +
    '<tr class="lvrow"><td>' + meter(5) + ' Середній</td><td class="num">4–6</td><td>Розуміє основні поняття, виконує типові завдання за алгоритмом; у нестандартних ситуаціях потребує підказок.</td></tr>' +
    '<tr class="lvrow"><td>' + meter(8) + ' Достатній</td><td class="num">7–9</td><td>Самостійно застосовує знання й цифрові інструменти, пояснює свої дії; помилки несуттєві.</td></tr>' +
    '<tr class="lvrow"><td>' + meter(11) + ' Високий</td><td class="num">10–12</td><td>Застосовує знання в новій ситуації, поєднує інструменти, обґрунтовує рішення, оцінює якість власного результату.</td></tr>' +
    '</tbody></table></div><p style="margin-top:8px"><small>Це узагальнений опис. Детальні критерії за класами та змістовими лініями — у <a href="https://osvita.ua/school/estimation/92739/" target="_blank" rel="noopener">наказі МОН</a>.</small></p>';
  h += '<div class="sect-h"><h2>Як рахує сайт</h2></div><div class="two">' +
    '<div class="card"><h3>Тест</h3><p>Питання поділено на чотири рівні досягнень: початковий, середній, достатній, високий. Кожен рівень дає чверть від 12 балів (3 бали), пропорційно частці правильних відповідей на ньому. Якщо повністю виконано лише початковий і середній рівні, результат — 6 балів. Щоразу тест складається випадково: по 3 питання на кожному рівні з великого банку теми, порядок питань і варіантів відповіді змінюється, а в числових завданнях значення різні, тож сусіди за партою мають різні варіанти.</p><p style="margin:0">Для питань із кількома відповідями потрібно обрати всі правильні. У журнал іде найкраща спроба; мінімальна оцінка — 1.</p></div>' +
    '<div class="card"><h3>Практична робота</h3><p>Кожна робота має 3–5 критеріїв, сума максимальних балів дорівнює 12. Бал за роботу — сума балів за критеріями. Оцінює вчитель або учень під час самооцінювання.</p><p style="margin:0">Приклад: правильність (4) + повнота (3) + самостійність (3) + оформлення (2).</p></div>' +
    '<div class="card"><h3>Оцінка за тему</h3><p>Зважене середнє тесту й практичної роботи. Вагу можна змінити нижче. Поки немає одного з компонентів, оцінка позначена як попередня.</p><p style="margin:0">Для теми без практичної роботи оцінка дорівнює балам за тест.</p></div>' +
    '<div class="card"><h3>Тематична контрольна</h3><p>Для кожного розділу програми автора є контрольна з 12 питань (по 3 на кожному рівні), яку щоразу випадково збирають з банків питань усіх тем розділу.</p><p style="margin:0">Її бали записуються окремим рядком у журнал.</p></div></div>';
  h += '<div class="sect-h"><h2>Ваги компонентів</h2><p>Збережуться в цьому браузері</p></div><div class="calc"><label for="w-test">Тест, %<input id="w-test" type="number" min="0" max="100" value="' + S.w.test + '" data-a="weights"></label>' +
    '<label for="w-prac">Практична, %<input id="w-prac" type="number" min="0" max="100" value="' + S.w.prac + '" data-a="weights"></label><p class="muted" style="grid-column:1/-1;margin:0" id="wnote">Сума ваг не обов’язково дорівнює 100, співвідношення важливе.</p></div>';
  h += '<div class="sect-h"><h2>Калькулятор оцінки за тему</h2><p>Правильні відповіді на кожному рівні тесту</p></div><div class="calc">' +
    [1, 2, 3, 4].map(function (l) { return '<label for="c-l' + l + '">' + LV[l] + ', правильних з 3<input id="c-l' + l + '" type="number" min="0" max="3" value="' + (l < 4 ? 3 : 1) + '" data-a="calc"></label>'; }).join('') +
    '<label for="c-pr">Бали за практичну (0–12)<input id="c-pr" type="number" min="0" max="12" value="9" data-a="calc"></label><div class="out" id="c-out">' + calcOut() + '</div></div>';
  return h;
}
function calcVals() {
  var v = [1, 2, 3, 4].map(function (l) { var e = $('#c-l' + l); return e ? Math.min(3, Math.max(0, +e.value || 0)) : (l < 4 ? 3 : 1); });
  var pe = $('#c-pr'); return { v: v, p: pe ? Math.min(12, Math.max(0, +pe.value || 0)) : 9 };
}
function calcOut() {
  var x = calcVals(), items = [];
  x.v.forEach(function (c, i) { for (var k = 0; k < 3; k++) items.push({ lv: i + 1, ok: k < c }); });
  var tp = scoreByLevels(items).p, wt = S.w.test, wp = S.w.prac, f = Math.round((tp * wt + x.p * wp) / ((wt + wp) || 1));
  return '<span>Тест: <b class="num">' + tp + '</b></span><span>Практична: <b class="num">' + x.p + '</b></span><span>Оцінка за тему: ' + meter(f) + ' ' + mark(f) + ' <b>' + lvl(f).name + '</b></span>';
}

/* ---------- Презентації ---------- */
function viewPrez(r) {
  var list = (window.PRES || []).filter(function (x) { return x && x.u && /^https?:\/\//.test(x.u); });
  var h = '<div class="crumbs"><a href="#home">Класи</a><i>/</i><span>Презентації</span></div><h1>Презентації до уроків</h1>' +
    '<p class="muted" style="max-width:70ch;margin-top:10px">Презентації вчителя до курсів за класами та авторами підручників. Посилання відкриваються в новій вкладці.</p>';
  h += '<nav class="seg" aria-label="Клас"><a href="#prezentacii"' + (!r.g ? ' aria-current="page"' : '') + '>Усі класи<span class="badge num">' + list.length + '</span></a>' +
    GRADES.map(function (g) { return '<a href="#prezentacii-' + g + '"' + (r.g === g ? ' aria-current="page"' : '') + '>' + g + ' клас</a>'; }).join('') + '</nav>';
  if (!list.length) return h + '<div class="empty-state">Презентації ще не додано. Щойно вчитель надішле посилання, вони з’являться тут за класами й авторами.</div>';
  GRADES.forEach(function (g) {
    if (r.g && r.g !== g) return;
    var items = list.filter(function (x) { return x.g === g; });
    if (!items.length) return;
    h += '<div class="strand-h">' + g + ' клас</div><div class="sec">';
    PK.forEach(function (pk) {
      items.filter(function (x) { return x.p === pk; }).forEach(function (x) {
        h += '<a class="trow" href="' + esc(x.u) + '" target="_blank" rel="noopener"><div><div class="tt">' + esc(x.t) + '</div><div class="tags">' + progChip(pk) + '</div></div><div class="st"><span class="badge">відкрити</span></div></a>';
      });
    });
    h += '</div>';
  });
  return h;
}

/* ---------- Журнал ---------- */
function journalRows() {
  var rows = [];
  GRADES.forEach(function (g) {
    var d = D[g]; if (!d) return;
    Object.keys(d.topics).forEach(function (id) {
      var r = resOf(id); if (!r.test && !r.prac) return;
      var tg = topicGrade(id);
      rows.push({ g: g, id: id, title: d.topics[id].title, t: r.test ? r.test.best : null, p: r.prac ? r.prac.pts : null, hasP: !!d.topics[id].practical, f: tg ? tg.v : null, partial: tg && tg.partial, date: (r.prac && r.prac.date) || (r.test && r.test.date) || '' });
    });
    PK.forEach(function (pk) {
      d.programs[pk].sections.forEach(function (s) {
        var r = resOf('k:' + s.id); if (!r.test) return;
        rows.push({ g: g, id: 'k:' + s.id, title: 'Контрольна: ' + s.title + ' (' + PROG[pk].name + ')', t: r.test.best, p: null, hasP: false, f: r.test.best, k: true, date: r.test.date });
      });
    });
  });
  return rows;
}
var confirmReset = false;
function viewZhurnal() {
  var rows = journalRows();
  var h = '<div class="crumbs"><a href="#home">Класи</a><i>/</i><span>Журнал</span></div><h1>Журнал результатів</h1>' +
    '<p class="muted" style="max-width:70ch;margin-top:10px">Тут зібрано бали за тести, практичні роботи та контрольні. Дані зберігаються лише в цьому браузері. Щоб передати вчителеві, скопіюйте таблицю й вставте в Excel чи Google Таблиці.</p>';
  h += '<div class="form"><label for="p-name">Прізвище та ім’я<input id="p-name" type="text" value="' + esc(S.profile.name) + '" data-a="profile" autocomplete="name"></label>' +
    '<label for="p-cls">Клас<input id="p-cls" type="text" value="' + esc(S.profile.cls) + '" data-a="profile" placeholder="Наприклад, 8-А"></label></div>';
  if (!rows.length) return h + '<div class="empty-state" style="margin-top:20px">Результатів ще немає. Пройдіть тест або оцініть практичну роботу, і вони з’являться тут.</div>';
  var sum = 0, n = 0; rows.forEach(function (x) { if (x.f != null) { sum += x.f; n++; } });
  var avg = n ? Math.round(10 * sum / n) / 10 : null;
  h += '<div class="sect-h"><h2>Результати</h2><p class="num">Записів: ' + rows.length + (avg != null ? ' · середній бал ' + String(avg).replace('.', ',') : '') + '</p></div>';
  h += '<div class="tbl"><table><thead><tr><th class="n">Клас</th><th>Тема</th><th class="n">Тест</th><th class="n">Практична</th><th class="n">Оцінка</th></tr></thead><tbody>';
  rows.forEach(function (x) {
    h += '<tr><td class="n">' + x.g + '</td><td>' + (x.k ? esc(x.title) : '<a href="#tema-' + x.id + '">' + esc(x.title) + '</a>') + '</td><td class="n">' + (x.t != null ? x.t : '—') + '</td><td class="n">' + (x.hasP ? (x.p != null ? x.p : '—') : 'немає') + '</td><td class="n">' + (x.f != null ? '<b>' + x.f + '</b>' + (x.partial ? ' <small>попер.</small>' : '') : '—') + '</td></tr>';
  });
  h += '</tbody></table></div><div class="testbar"><button type="button" class="btn" data-a="copytable">Скопіювати для Excel</button>' +
    (confirmReset ? '<span class="confirm"><b>Видалити всі результати?</b><button type="button" class="btn small" data-a="resetyes">Так, видалити</button><button type="button" class="btn small ghost" data-a="resetno">Скасувати</button></span>' : '<button type="button" class="btn ghost" data-a="resetask">Очистити журнал</button>') + '</div>';
  return h;
}
function tableTSV() {
  var rows = journalRows(), out = ['Учень\t' + S.profile.name, 'Клас\t' + S.profile.cls, '', ['Клас', 'Тема', 'Тест', 'Практична', 'Оцінка', 'Дата'].join('\t')];
  rows.forEach(function (x) { out.push([x.g, x.title, x.t != null ? x.t : '', x.hasP ? (x.p != null ? x.p : '') : 'немає', x.f != null ? x.f : '', x.date].join('\t')); });
  return out.join('\n');
}

/* ---------- Рендер і події ---------- */
var app, lastId = null;
function render() {
  var r = parseRoute(), body;
  if (r.v === 'klas') body = viewKlas(r);
  else if (r.v === 'tema') body = viewTema(r);
  else if (r.v === 'kontrol') body = viewKontrol(r);
  else if (r.v === 'ocinuvannya') body = viewOcinuvannya();
  else if (r.v === 'zhurnal') body = viewZhurnal();
  else if (r.v === 'prezentacii') body = viewPrez(r);
  else body = viewHome();
  app.innerHTML = topbar(r) + '<main><div class="wrap">' + body + '</div></main>' + footer();
  var title = 'Інформатика 5–11';
  if (r.v === 'tema') title = TOPIC[r.id].t.title + ' · ' + title;
  else if (r.v === 'klas') title = r.g + ' клас · ' + title;
  else if (r.v === 'ocinuvannya') title = 'Оцінювання · ' + title;
  else if (r.v === 'zhurnal') title = 'Журнал · ' + title;
  else if (r.v === 'prezentacii') title = 'Презентації · ' + title;
  document.title = title;
  var id = r.v === 'tema' ? r.id : r.v + (r.g || r.sid || '') + (r.prog || '');
  if (id !== lastId) window.scrollTo(0, 0);
  else { var tb = $('#tabs'); if (tb) tb.scrollIntoView({ block: 'start' }); }
  lastId = id;
}
function rerenderPanel() {
  var r = parseRoute(), p = $('#panel'); if (!p) return render();
  if (r.v === 'tema' && r.tab === 'test') p.innerHTML = testPanel();
  else if (r.v === 'kontrol') p.innerHTML = testPanel();
  var tb = $('#tabs'), top = (tb || p).getBoundingClientRect().top + window.pageYOffset - 70;
  window.scrollTo(0, Math.max(0, top));
}
function onClick(e) {
  var a = e.target.closest('[data-a]'); if (!a) return;
  var act = a.getAttribute('data-a');
  if (act === 'copy') { var code = a.closest('.codewrap').querySelector('code').textContent; copyText(code, 'Скопійовано'); }
  else if (act === 'crit') {
    pr.vals[+a.getAttribute('data-i')] = +a.getAttribute('data-v');
    $('#rubric').innerHTML = rubricHtml(pr.id);
  } else if (act === 'savep') {
    var P = TOPIC[pr.id].t.practical, sum = pr.vals.reduce(function (x, y) { return x + y; }, 0);
    var r = S.res[pr.id] || (S.res[pr.id] = {});
    r.prac = { pts: sum, crit: pr.vals.slice(), date: today() }; save();
    toast('Записано в журнал: ' + sum + ' з 12');
    $('#rubric').innerHTML = rubricHtml(pr.id);
  } else if (act === 'retry') {
    var rt = parseRoute();
    if (rt.v === 'kontrol') { var X = SECTION[rt.sid]; buildRun('k:' + rt.sid, X.s.title, pickKontrol(X.s), run.back); }
    else { var T = TOPIC[rt.id].t; buildRun(rt.id, T.title, T.test, run.back); }
    rerenderPanel();
  } else if (act === 'copytable') copyText(tableTSV(), 'Таблицю скопійовано');
  else if (act === 'resetask') { confirmReset = true; render(); }
  else if (act === 'resetno') { confirmReset = false; render(); }
  else if (act === 'resetyes') { S.res = {}; save(); confirmReset = false; pr = { id: null, vals: [] }; run = null; render(); toast('Журнал очищено'); }
}
function onSubmit(e) {
  if (e.target.id !== 'qform') return;
  e.preventDefault(); finishRun(); rerenderPanel();
  var r = parseRoute(); if (r.v === 'tema') { var tabs = $('#tabs'); if (tabs) { var a = tabs.querySelector('a:nth-child(2)'); if (a) a.innerHTML = 'Тест ' + mark(resOf(r.id).test.best); } }
}
function onInput(e) {
  var t = e.target, act = t.getAttribute && t.getAttribute('data-a');
  if (t.closest && t.closest('#qform')) {
    var f = $('#qform'), n = 0;
    run.qs.forEach(function (x, i) {
      var nm = 'q' + i;
      if (x.q.type === 'input') { if (f.elements[nm].value.trim()) n++; }
      else if (f.querySelector('input[name="' + nm + '"]:checked')) n++;
    });
    var el = $('#answered'); if (el) el.textContent = 'Відповіді: ' + n + ' з ' + run.qs.length;
    return;
  }
  if (act === 'search') doSearch(t.value);
  else if (act === 'profile') { S.profile.name = $('#p-name').value; S.profile.cls = $('#p-cls').value; save(); }
  else if (act === 'weights') {
    var a = Math.max(0, Math.min(100, +$('#w-test').value || 0)), b = Math.max(0, Math.min(100, +$('#w-prac').value || 0));
    if (a + b === 0) { a = 40; b = 60; }
    S.w = { test: a, prac: b }; save();
    var o = $('#c-out'); if (o) o.innerHTML = calcOut();
  } else if (act === 'calc') $('#c-out').innerHTML = calcOut();
}
function init() {
  app = document.getElementById('app');
  document.addEventListener('click', onClick);
  document.addEventListener('submit', onSubmit);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onInput);
  document.addEventListener('click', function (e) { if (!e.target.closest('.search')) { var b = $('#sres'); if (b) b.className = 'sres'; } });
  window.addEventListener('hashchange', render);
  render();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>

</body></html>
